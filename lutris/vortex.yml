name: Vortex Mod Manager
game_slug: vortex-mod-manager
version: OpenModLinux 0.2.0 - latest stable
slug: vortex-mod-manager-openmodlinux-latest
runner: wine

script:
  game:
    arch: win64
    prefix: $GAMEDIR
    exe: $GAMEDIR/drive_c/Program Files/Vortex/Vortex.exe
    working_dir: $GAMEDIR/drive_c/Program Files/Vortex

    args: --user-data "C:\SteamLibrary\steamapps\vortex-userdata" --disable-gpu --disable-gpu-compositing --disable-gpu-sandbox --no-sandbox --force-device-scale-factor=1
  system:
    gamemode: false

  installer:
    - execute:
        file: $SCRIPTDIR/../scripts/download-vortex-latest.sh
        args: '"$CACHE/vortex-setup-latest.exe"'
        working_dir: $SCRIPTDIR/../scripts
        disable_runtime: true
        description: Downloading the latest stable official Vortex installer

    - task:
        name: create_prefix
        arch: win64
        prefix: $GAMEDIR
        install_mono: false
        install_gecko: false

    - task:
        name: winetricks
        app: dotnet48 corefonts win10
        prefix: $GAMEDIR
        silent: true
        description: Installing .NET Framework 4.8, core fonts and restoring Windows 10 mode
    - task:
        name: set_regedit
        path: HKEY_CURRENT_USER\Software\Wine\WineDbg
        key: ShowCrashDialog
        type: REG_DWORD
        value: '00000000'

    - task:
        name: set_regedit
        path: HKEY_LOCAL_MACHINE\Software\Microsoft\.NETFramework
        key: OnlyUseLatestCLR
        type: REG_DWORD
        value: '00000001'

    - task:
        name: set_regedit
        path: HKEY_LOCAL_MACHINE\Software\WOW6432Node\Microsoft\.NETFramework
        key: OnlyUseLatestCLR
        type: REG_DWORD
        value: '00000001'
        
    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Valve\Steam
        key: SteamPath
        value: C:\SteamLibrary
        type: REG_SZ

    - task:
        name: set_regedit
        prefix: $GAMEDIR
        path: HKEY_CURRENT_USER\Software\Valve\Steam
        key: SteamExe
        value: C:\SteamLibrary\Steam.exe
        type: REG_SZ

    - task:
        name: wineexec
        executable: $CACHE/vortex-setup-latest.exe
        prefix: $GAMEDIR
        arch: win64
        blocking: true
        description: Installing Vortex

    - execute:
        file: $SCRIPTDIR/../scripts/post-install.sh
        args: '"$GAMEDIR" "$WINEBIN"'
        working_dir: $SCRIPTDIR/../scripts
        disable_runtime: true
        description: Integrating Steam, NXM, Linux folders and Vortex staging

  wine:
    dxvk: false

  require-binaries: bash, python3, curl, xdg-mime, sha256sum
